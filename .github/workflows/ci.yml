name: CI

on:
  push:
    branches: [main, feat/days-executor]
    paths-ignore:
      - "docs/**"
      - "logs/**"
      - "**.md"
  # Pull requests run on every change, docs-only included: the `changes` job below skips the real
  # jobs when only docs/**, logs/** or **.md changed. A job skipped by its `if:` reports Success,
  # so docs-only PRs stay fast and never wait on a required check; a workflow skipped by path
  # filtering would leave its required checks Pending forever.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether a pull request changes anything outside docs/**, logs/** and **.md, the paths
  # the push trigger ignores. The real jobs skip only on an explicit `code=false`: if this job
  # fails or reports nothing, they run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the pull request's test merge; its first parent is the base branch head, so
          # this lists exactly what the merge changes. --no-renames lists both sides of a move.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          code=false
          while IFS= read -r path; do
            case "$path" in
              "" | docs/* | logs/* | *.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf 'code=%s\n%s\n' "$code" "$changed"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint test-feature targets across the workspace
        run: cargo clippy --workspace --all-targets --features test -- -D warnings

      - name: Audit crate and feature boundaries
        run: cargo xtask audit

  # The debug test matrix runs as parallel `test-shard` jobs; .github/test-shards.sh holds the
  # layout and checks it against `cargo metadata`, so every target that the old four
  # `cargo test -p <package>` lines built or ran belongs to exactly one shard. This job prints the
  # layout and hands the shard names to the matrix, so a shard added to the script cannot be left
  # out of CI. It runs alongside lint and needs no build.
  test-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the shard layout covers every test target once
        id: plan
        shell: bash
        run: |
          shards=$(.github/test-shards.sh plan)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, lint, test-plan]
    # GitHub evaluates this `if` before expanding the matrix, so a skipped plan (docs-only pull
    # request, lint failure) never feeds an empty list to fromJSON.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.lint.result == 'success' && needs.test-plan.result == 'success' }}
    strategy:
      # Run every shard to the end, so one failure does not cancel and hide the others.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Each shard warms its own cache: the matrix entries share one job id, so without `key`
      # they would race to save a single entry holding whichever shard's dependencies finished
      # first.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.shard }}

      - name: Run test shard ${{ matrix.shard }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: .github/test-shards.sh run "$SHARD"

  # The required `test` check. It passes when every shard passed, or when the shards were skipped
  # because the pull request changes only docs/**, logs/** or **.md; anything else fails: a shard
  # that failed, was cancelled or timed out, or shards skipped by a failed lint or layout check.
  # `always()` rather than `!cancelled()`: a skipped job satisfies a required check, so this job
  # must always conclude. With `!cancelled()` a cancelled head run would leave `test` skipped,
  # which reads as passing; with `always()` it fails instead (superseded runs cancelled by the
  # concurrency group also show a failed `test`, which no ruleset reads).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, test-shard]
    if: ${{ always() }}

    steps:
      - name: Require every test shard to pass
        shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "changes.code=$CODE test-shard.result=$SHARDS"
          if [ "$SHARDS" = success ]; then
            exit 0
          fi
          if [ "$CODE" = false ] && [ "$SHARDS" = skipped ]; then
            echo "Docs-only change: the test shards were skipped."
            exit 0
          fi
          echo "::error::test shards did not all pass (result: $SHARDS)"
          exit 1

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.lint.result == 'success' }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run executor smoke examples
        run: |
          cargo run --release --bin days -- configs/ci/executor_smoke.toml --engine scalar
          cargo run --release --bin days -- configs/ci/executor_smoke.toml --engine cpu --workers 1 --repetitions 1

      - name: Run representative legacy examples
        run: |
          cargo run --release -p days-legacy --example basic
          cargo run --release -p days-legacy --example ecn
          cargo run --release -p days-legacy --example switch

  scaling:
    runs-on: ubuntu-latest
    # A passing run takes minutes. On a tree with a quadratic regression, where the test caps
    # each size at one sample once a sample exceeds 60 s, the test step ran 42 minutes on four
    # x86 cores (evidence/P14/ci-scaling.md in days-gpu); this leaves about twice that, plus the
    # build, for a slower runner.
    timeout-minutes: 90
    needs: [changes, lint]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.lint.result == 'success' }}

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Complexity gate for host-side work. Each case times a phase at two sizes and bounds the
      # ratio, so machine speed cancels; a breach is re-measured once before the case fails
      # (tests/host_scaling_budget.rs). Constant-factor costs are out of scope.
      #
      # Each line is `scaling <cargo test selection> -- <exact case names>`. The cases run one at a
      # time, in release, with their `record=host_scaling_budget` lines in the log. `--exact` with
      # a stale name would run nothing and pass, so the function also requires every named case to
      # have run and passed.
      #
      # To gate another test file, add one line, for example:
      #   scaling -p days --features test --test <file> -- <case> [<case>...]
      # Only wall-clock ratio cases belong here. Deterministic budgets (scalar_stage_scaling,
      # collective_lowering_budget's heap case, route_scaling_budget,
      # stageless_lowering_heap_budget) run in the default test matrix;
      # collective_lowering_budget's ignored time case is deliberately not wired in, since it
      # does not reliably catch the route cost.
      # The Metal-plan phase is not gated here: it peaks above 10 GB at the CI sizes, beyond a
      # hosted macos-15 runner's 7 GB (evidence/P14/ci-scaling.md in days-gpu).
      - name: Run CI-sized host scaling gates
        shell: bash
        run: |
          scaling() {
            local selection=()
            while [ "$1" != "--" ]; do selection+=("$1"); shift; done
            shift
            cargo test --release "${selection[@]}" -- \
              --ignored --exact --test-threads=1 --nocapture "$@" | tee scaling.log
            local passed
            passed=$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' scaling.log)
            if [ "$passed" != "$#" ]; then
              echo "::error::expected $# scaling cases to pass, ${passed:-0} ran"
              exit 1
            fi
          }
          scaling -p days --features test --test host_scaling_budget -- \
            ci_scaling_frontier_host_phases ci_scaling_topology_host_phases \
            ci_scaling_collective_stage_validation ci_scaling_aicb_pfc_validation

  metal-check:
    runs-on: macos-15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check Metal backend
        run: cargo check -p days-executor --features metal

      - name: Check Metal-gated targets across the workspace
        run: cargo check --workspace --all-targets --features metal

      - name: Check test-gated Metal targets across the workspace
        run: cargo check --workspace --all-targets --features test,metal
