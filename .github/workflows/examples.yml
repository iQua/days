name: Run Examples and Test Cases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build and run examples
        run: |
          for example in legacy/examples/*; do
            if [ -f "$example" ]; then
              echo "Running example: $example"
              cargo run --release -p days-legacy --example $(basename "$example" .rs)
            fi
          done

          cargo run --release --example scalar_benchmark -- configs/simple.toml
          cargo run --release --example round_benchmark -- configs/simple.toml --repetitions 1

      - name: Run partitioned default test matrix
        run: |
          cargo test -p days-executor -- --show-output
          cargo test -p days --features test -- --show-output
          cargo test -p days-legacy --features test -- --show-output
          cargo test -p days-validation --features test -- --show-output
