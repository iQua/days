[package]
name = "ns"
version = "0.1.0"
description = "A Performant Discrete-Event Simulator for Network Simulations with Rust"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
repository = "https://github.com/iqua/ns.rs"
readme = "README.md"
keywords =  ["network", "simulation", "framework", "time", "discrete", "events"]
categories = ["simulation", "science"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sim = { path = "../sim" }
rand = {version = "0.8.5", features = ["small_rng"]}
rand_distr = "0.4.3"
