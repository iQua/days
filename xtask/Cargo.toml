[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Repository audit and evidence tooling for the Days Executor program"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
