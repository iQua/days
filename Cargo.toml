[package]
name = "days"
version = "0.4.3"
description = "Days: A Performant Discrete-Event Simulator for Network Simulations"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
repository = "https://github.com/iqua/days"
readme = "README.md"
keywords = ["network", "simulation", "framework", "time", "discrete", "events"]
categories = ["simulation", "science"]
license = "AGPL-3.0-only"
edition = "2021"

[[bin]]
name = "t20b3_queue_bytes"
path = "src/bin/t20b3_queue_bytes.rs"
test = false
bench = false

[workspace]
members = ["executor", "legacy", "validation", "xtask"]
resolver = "2"

[features]
test = []
l2_pfc = []
dcqcn = []
lean = []
metal-spike = ["days-executor/metal-spike"]
cuda = ["days-executor/cuda"]

[dependencies]
csv = "1.4"
days-executor = { path = "executor" }
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
num-bigint = "0.4.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "fmt", "env-filter", "registry" ] }
parking_lot = "0.12"
petgraph = "0.8"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = "1"

[patch.crates-io]
nexosim = { path = "crates/nexosim" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
