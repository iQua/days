[package]
name = "daytone"
version = "0.3.4"
description = "Daytone: A Performant Discrete-Event Simulator for Network Simulations"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
repository = "https://github.com/iqua/daytone"
readme = "README.md"
keywords = ["network", "simulation", "framework", "time", "discrete", "events"]
categories = ["simulation", "science"]
license = "Apache-2.0"
edition = "2021"

[features]
test = []

[dependencies]
csv = "1.3"
env_logger = "0.11"
indicatif = "0.17"
indicatif-log-bridge = "0.2"
log = "0.4"
nexosim = "0.3"
parking_lot = "0.12"
petgraph = "0.7"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
statrs = "0.18"
thiserror = "2"
toml = "0.8"
tempfile = "3.14"
scopeguard = "1.1"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
