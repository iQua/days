[package]
name = "days"
version = "0.4.2"
description = "Days: A Performant Discrete-Event Simulator for Network Simulations"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
repository = "https://github.com/iqua/days"
readme = "README.md"
keywords = ["network", "simulation", "framework", "time", "discrete", "events"]
categories = ["simulation", "science"]
license = "Apache-2.0"
edition = "2021"

[features]
test = []
l2 = []
l2_pfc = ["l2"]
dcqcn = []
lean = []
perf_stats = ["nexosim/perf_stats"]

[dependencies]
csv = "1.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
indicatif-log-bridge = "0.2"
log = "0.4"
nexosim = { version = "1.0.0", features = ["tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "fmt", "env-filter", "registry" ] }
parking_lot = "0.12"
petgraph = "0.8"
rand_distr = "0.6"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
toml = "1"
tempfile = "3"
tachyonix = "0.3"
futures = "0.3"
futures-executor = { version = "0.3", default-features = false, features = ["thread-pool"] }
once_cell = "1"
num_cpus = "1.17"

[patch.crates-io]
nexosim = { path = "crates/nexosim" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
