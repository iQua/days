[project]
name = 'dayone'

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
name = "dayone"
version = "0.1.5"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
description = "A Performant Discrete-Event Simulator for Network Simulations" 
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Rust",
]
bindings = "bin"
