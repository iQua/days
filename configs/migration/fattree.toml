# Bounded, deterministic open-loop UDP corpus case derived from configs/fattree.toml.

seed = 1000
duration = 0.002
threading = "single"
time_quantum_ns = 1
log_path = "logs/migration/fattree"

[topology]
category = "FatTree"

[topology.fat_tree]
k = 4

[switch]
port_rate = 1_000_000_000
capacity = 32
weights = [1]
discipline = "FIFO"
drop = "TailDrop"

[[flow_set]]
flow_type = "PacketDistribution"
flow_count = 8
routing = "ShortestPath"

[flow_set.traffic]
initial_delay = 0.0
duration = 0.001
arr_dist = { type = "Uniform", low = 0.0001, high = 0.0001 }
pkt_size_dist = { type = "Uniform", low = 1000, high = 1000 }
