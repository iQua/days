# Small, deterministic open-loop UDP corpus case derived from configs/simple.toml.

seed = 1000
duration = 0.002
threading = "single"
time_quantum_ns = 1
edges = [[0, 1], [0, 2]]
hosts = [0, 1, 2]
log_path = "logs/migration/explicit"

[switch]
port_rate = 1_000_000_000
capacity = 32
weights = [1]
discipline = "FIFO"
drop = "TailDrop"

[[flow]]
flow_type = "PacketDistribution"
graph = [[0, 1]]

[flow.traffic]
initial_delay = 0.0
duration = 0.001
arr_dist = { type = "Uniform", low = 0.0001, high = 0.0001 }
pkt_size_dist = { type = "Uniform", low = 1000, high = 1000 }

[[flow]]
flow_type = "PacketDistribution"
graph = [[0, 2]]

[flow.traffic]
initial_delay = 0.0
duration = 0.001
arr_dist = { type = "Uniform", low = 0.0001, high = 0.0001 }
pkt_size_dist = { type = "Uniform", low = 1000, high = 1000 }
