# An example configuration file for using TCP in a FatTree topology.
seed = 100
mailbox_capacity = 16
duration = 2.0 
threading = "multiple"
log_path = "logs/exp/tcp_fattree/t10_m1000"
ui_interval = 1e9
time_quantum_ns = 102400
hot_workers = 2
concurrency_level = "accelerated"

[topology]
    category = "FatTree"

[topology.fat_tree]
    k = 96

[switch]
    port_rate = 10000000 # 10 Mbps
    capacity = 1000
    weights = [1]
    discipline = "FIFO"
    drop = "RED"

[[flow_set]]
    flow_type = "TCP"
    flow_count = 500
    routing = "ShortestPath"

    [flow_set.traffic]
    initial_delay = 0.0
    duration = 2.0 
    arr_dist = { type = "Uniform", low = 0.0008, high = 0.0008 }
    pkt_size_dist = { type = "Uniform", low = 1024, high = 1024 }

    [flow_set.traffic.tcp]
    cc_algorithm = "CUBIC"

    [flow_set.traffic.tcp.cubic]
    beta = 0.7
    c = 0.4
    fast_convergence = true
