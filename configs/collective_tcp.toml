seed = 1000
edges = [[0, 2], [0, 3], [1, 2], [1, 3], [0, 4], [3, 4]]
hosts = [0, 1, 2, 3, 4]
report_interval = 2.0
duration = 20.0
log_path = "logs/collective_tcp"

[switch]
port_rate = 1000000
capacity = 100
weights = [1]
discipline = "FIFO"
drop = "RED"

[[collective]]
collective_type = "Broadcast"
flow_type = "TCP"
flow_count = 4
sources = [4, 4, 4, 4]
sinks = [2, 3, 0, 1]

[collective.traffic]
initial_delay = 0.0
size = 3000
arr_dist = { type = "Uniform", low = 3, high = 4 }
pkt_size_dist = { type = "Uniform", low = 2000, high = 2500 }

[collective.traffic.tcp]
cc_algorithm = "TCPReno"


