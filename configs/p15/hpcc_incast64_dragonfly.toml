# P15 HPCC cross-check fixture: HPCC's 64->1 incast (custody config 04, flows 05) on the Days
# side, as evidence/P15/hpcc-prep.md section 5.1 maps it. Generated by
# days-gpu/evidence/P15/qp-impl/tooling/gen_hpcc_incast64.py; do not edit by hand.
#
# Topology: Dragonfly embedding of HPCC's one-switch 65-host star (routers_per_group = 2,
# global_ports_per_router = 1, hosts_per_router = 65: 3 groups, 6 routers, 390 hosts). Host id =
# ordinal * 6 + router, so router 0 carries hosts 0, 6, 12, ..., 384, one switch hop apart.
# Mapping: HPCC host n (1..65) -> Days host 6 * (n - 1); HPCC switch node 0 -> Days router 0.
# HPCC receiver host 1 -> Days host 0; HPCC senders 2..65 -> Days hosts 6, 12, ..., 384. The five
# other routers (1..5) and their 325 hosts are idle; no flow may use them.
#
# Values (hpcc-prep.md section 4): 100 Gbps ports, 1 us links; 1,048-byte packets (1,000 B payload
# + 48 B headers), 2,000 packets = 2,096,000 B per flow; class 3 lossless with static PFC
# thresholds at HPCC's empty-pool point (xoff 3,856,336 B, xon 3,072 B lower, buffer = xoff +
# 37,500 B headroom); queues of 100,000 packets so Days never tail-drops; an ECN step at 954
# packets (the midpoint of HPCC's 400 KB..1.6 MB ramp); feedback on class 0, which has no PFC
# (HPCC ACK_HIGH_PRIO). The QP is HPCC's profile: no retransmission timeout, duplicates dropped
# silently, a 60-byte ACK/NACK, an ACK per packet, a 500 us NACK interval. DCQCN keys follow
# HPCC's config 02 (EWMA gain 1/256, AI 20 Mb/s, HAI 200 Mb/s, min 100 Mb/s, RP timer 300 us);
# Days keeps its own controller and separate CNP (hpcc-prep.md Q3), with no CNP interval. The
# pacing tick is 80 ns, so one packet per tick can carry 104.8 Gbps, above the port rate.
seed = 1
duration = 0.05

[topology]
category = "Dragonfly"

[topology.dragonfly]
routers_per_group = 2
global_ports_per_router = 1
hosts_per_router = 65

[switch]
port_rate = 100_000_000_000
capacity = 100_000
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.00954

[link]
mode = "Pfc"
propagation_ns = 1000

[link.pfc]
xoff = [0, 0, 0, 3_856_336, 0, 0, 0, 0]
xon = [0, 0, 0, 3_853_264, 0, 0, 0, 0]
buffer_capacity = [0, 0, 0, 3_893_836, 0, 0, 0, 0]

