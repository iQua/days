# P15 lane R3 fixture (collective stages over RoCE queue pairs). Generated by
# days-gpu/evidence/P15/collectives-impl/tooling/gen_roce_collective_fixtures.py; do not edit by hand.
#
# The 4-switch line of configs/p15/roce_lossless_pfc.toml (hosts 0..3 on switches 0..3, 1 Gbps
# ports) with the queue pairs' DCQCN keys of that file. The ring order 0, 2, 1, 3 puts two ring
# flows on the switch 1 -> 2 link and two on the switch 2 -> 1 link, so the stages contend.
# Lossless: data rides class 3 with switch and host-link PFC (the thresholds of
# hostpfc_incast_lossless.toml); ACKs, NACKs and CNPs ride class 0, which has none.
# Contract (tests/p15_roce_collectives.rs): all 24 stages finish; no drop, NACK,
# retransmission or timeout; PFC pauses occur; Scalar = CPU at 1 to 4 workers.
