# P15 host-link PFC fixture: a 3->1 queue-pair incast into host 0 on the 4-switch line of
# configs/p15/roce_lossless_pfc.toml (hosts 0..3 on switches 0..3, 1 Gbps ports), with PFC on the
# host links too (`[link.pfc] host_links = true`). Generated by
# days-gpu/evidence/P15/hostpfc-impl/tooling/gen_hostpfc_incast_lossless.py; do not edit by hand.
#
# Data rides class 3, the only class with PFC; every queue pair's ACKs, NACKs and CNPs ride
# class 0 (`feedback_priority = 0`), which has none, so a pause never holds feedback (as in HPCC).
# Queues hold 300 packets and no ECN marking happens below a full queue, so the bottleneck is
# held by PFC alone: switch 0 pauses switch 1, switch 1 pauses host 1 and switch 2, and so on.
# Without host-link PFC the senders overrun their first switch and packets drop; the queue pairs
# use HPCC's profile (no retransmission timeout), so nothing but PFC keeps them complete.
# Contract (tests/p15_hostpfc_fixtures.rs): no drop, NACK or retransmission; pauses at hosts;
# every queue pair completes.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.05

[switch]
port_rate = 1000000000
capacity = 300
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 1.0

[link]
mode = "Pfc"

[link.pfc]
host_links = true
buffer_capacity = [0, 0, 0, 100000, 0, 0, 0, 0]
xoff = [0, 0, 0, 20000, 0, 0, 0, 0]
xon = [0, 0, 0, 10000, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 3
graph = [[1, 0]]

[flow.traffic]
initial_delay = 0.0
size = 1000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 0
feedback_priority = 0

[[flow]]
flow_type = "RoCE"
priority = 3
graph = [[2, 0]]

[flow.traffic]
initial_delay = 0.0
size = 1000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 0
feedback_priority = 0

[[flow]]
