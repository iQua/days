# P15 host-link PFC fixture (fix round 1 of the host-PFC review, M1 and M2): the lossless incast
# of configs/p15/hostpfc_incast_lossless.toml (4-switch line, 1 Gbps, class 3 lossless with PFC on
# the host links, feedback on class 0) with two additions. Generated by
# days-gpu/evidence/P15/hostpfc-impl/tooling/gen_hostpfc_multi_qp_tcp.py; do not edit by hand.
#
# - Host 1 runs three queue pairs to host 0 (hosts 2 and 3 one each), so one RESUME at host 1
#   restarts several pause-parked pairs and their `resume` rows share an event key (schema
#   Amendment 2's ordering, the CSV writer's admission, the parked list's multi-entry drain).
# - Host 2 also runs a TCP Reno flow on the paused class 3. Its packets wait in the host queue
#   while the class is paused (ruling H1 (a), egress-only for generators other than queue pairs), so
#   the host's egress eligibility rule decides real service starts.
# Contract (tests/p15_roce_fixtures.rs, tests/p15_roce_records.rs, tests/p15_hostpfc_validation.rs):
# no drop; every queue pair and the TCP flow complete; resume rows share keys; no host starts a
# packet of a class paused at it; mid-run checkpoints revalidate.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.08

[switch]
port_rate = 1000000000
capacity = 300
discipline = "FIFO"
drop = "TailDrop"
ecn_capacity_bytes = 300_000
ecn = { kmin_bytes = 300_000, kmax_bytes = 300_000, pmax = 1 }

[link]
mode = "Pfc"

[link.pfc]
host_links = true
buffer_capacity = [0, 0, 0, 100000, 0, 0, 0, 0]
xoff = [0, 0, 0, 20000, 0, 0, 0, 0]
xon = [0, 0, 0, 10000, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 3
graph = [[1, 0]]

[flow.traffic]
initial_delay = 0.0
size = 1000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
