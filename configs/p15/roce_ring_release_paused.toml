# P15 lane R3 fixture (collective stages over RoCE queue pairs). Generated by
# days-gpu/evidence/P15/collectives-impl/tooling/gen_roce_collective_fixtures.py; do not edit by hand.
#
# The 4-switch line of configs/p15/roce_lossless_pfc.toml (hosts 0..3 on switches 0..3, 1 Gbps
# ports) with the queue pairs' DCQCN keys of that file. The ring order 0, 2, 1, 3 puts two ring
# flows on the switch 1 -> 2 link and two on the switch 2 -> 1 link, so the stages contend.
# roce_ring_allreduce_lossless.toml plus a background queue pair from host 3 to host 0
# (500,000 B, the stages' DCQCN keys, data class 3, feedback class 0), which keeps class 3
# busy on host 3's link, so a stage released there finds its data class paused (design
# note §5.3; ruling C6). Contract: a stage's first pacing tick is a class_paused tick at
# its release, the stage joins its host's parked list, a RESUME restarts it, every stage
# finishes, nothing drops.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.05

[switch]
port_rate = 1000000000
capacity = 300
discipline = "FIFO"
drop = "TailDrop"
ecn_capacity_bytes = 300_000
ecn = { kmin_bytes = 300_000, kmax_bytes = 300_000, pmax = 1 }

[link]
mode = "Pfc"

[link.pfc]
