# P15 lane R3 fixture (collective stages over RoCE queue pairs). Generated by
# days-gpu/evidence/P15/collectives-impl/tooling/gen_roce_collective_fixtures.py; do not edit by hand.
#
# The 4-switch line of configs/p15/roce_lossless_pfc.toml (hosts 0..3 on switches 0..3, 1 Gbps
# ports) with the queue pairs' DCQCN keys of that file. The ring order 0, 2, 1, 3 puts two ring
# flows on the switch 1 -> 2 link and two on the switch 2 -> 1 link, so the stages contend.
# A workload DAG on the lossless fabric of roce_ring_allreduce_lossless.toml: compute
# `forward` (5 us) -> RoCE RingAllReduce `grad` -> compute `backward` (7 us). Contract:
# every root stage releases at 5,000 ns with its first pacing tick there; `backward`
# finishes 7,000 ns after its release; no drop.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.05

[switch]
port_rate = 1000000000
capacity = 300
discipline = "FIFO"
drop = "TailDrop"
ecn_capacity_bytes = 300_000
ecn = { kmin_bytes = 300_000, kmax_bytes = 300_000, pmax = 1 }

[link]
mode = "Pfc"

[link.pfc]
host_links = true
buffer_capacity = [0, 0, 0, 100000, 0, 0, 0, 0]
xoff = [0, 0, 0, 20000, 0, 0, 0, 0]
xon = [0, 0, 0, 10000, 0, 0, 0, 0]

[[compute]]
name = "forward"
hosts = [0, 2, 1, 3]
duration_ns = 5000

[[collective]]
name = "grad"
after = "forward"
collective_type = "RingAllReduce"
flow_type = "RoCE"
priority = 3
flow_count = 4
sources = [0, 2, 1, 3]
sinks = [2, 1, 3, 0]

[collective.traffic]
initial_delay = 0.0
size = 400000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[collective.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[collective.traffic.roce]
retransmit_timeout_ns = 1000000
feedback_priority = 0

[[compute]]
name = "backward"
hosts = [0, 2, 1, 3]
duration_ns = 7000
after = "grad"
