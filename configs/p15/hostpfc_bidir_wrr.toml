# P15 lane R4 fix round 1 (device review M1): bidirectional host-link PFC under a WRR switch
# discipline, so a feedback packet (class 0) waits in a switch queue behind a paused data class (3)
# and the device's paused-class scan (`scheduler_first_packet_for_class`) must read the feedback
# class (ruling D2). Generated by
# days-gpu/evidence/P15/device-impl/tooling/gen_hostpfc_bidir.py from
# configs/p15/hostpfc_multi_qp_tcp.toml; do not edit by hand.
#
# - configs/p15/hostpfc_multi_qp_tcp.toml at 30 ms: host 1 runs three queue pairs to host 0, hosts
#   2 and 3 one each, host 2 also a TCP Reno flow, all on class 3 with host-link PFC.
# - Two reverse queue pairs, host 0 to host 3 and host 1 to host 3, so ACK/NACK and CNP feedback
#   travels against paused data through the same switch egress queues.
# - Switch discipline WRR with weights [3, 1, 2] and priorities [3, 2, 1] (the review's probe).
# Contract (tests/p15_device_qp.rs): Metal and CUDA equal Scalar; tests/p15_roce_fixtures.rs: CPU
# at 1-4 workers equals Scalar.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.03

[switch]
port_rate = 1000000000
capacity = 300
weights = [3, 1, 2]
priorities = [3, 2, 1]
discipline = "WRR"
drop = "TailDrop"
ecn_capacity_bytes = 300_000
ecn = { kmin_bytes = 300_000, kmax_bytes = 300_000, pmax = 1 }

[link]
mode = "Pfc"

[link.pfc]
host_links = true
buffer_capacity = [0, 0, 0, 100000, 0, 0, 0, 0]
xoff = [0, 0, 0, 20000, 0, 0, 0, 0]
xon = [0, 0, 0, 10000, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 3
graph = [[1, 0]]

[flow.traffic]
initial_delay = 0.0
size = 1000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

