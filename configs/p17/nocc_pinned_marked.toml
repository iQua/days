# P17 lane nocc fixture: nocc_marked.toml with every queue pair's DCQCN controller pinned at line rate (P16).
# Generated by days-gpu/evidence/P17/nocc/tooling/gen_nocc_fixtures.py; do not edit by hand.
#
# The 4-switch line of configs/p15 (hosts 0..3 on switches 0..3, 1 Gbps ports, 1,000 B packets).
# A queue pair with `congestion_control = "none"` paces at its host's line rate: one packet per
# ceil(1000 * 8e9 / 1e9) = 8,000 ns.
# Contract (tests/p17_nocc.rs): the same departures and arrivals as nocc_marked.toml.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.02

[switch]
port_rate = 1000000000
capacity = 1000
discipline = "FIFO"
drop = "TailDrop"
ecn_capacity_bytes = 1_000_000
ecn = { kmin_bytes = 20_000, kmax_bytes = 60_000, pmax = 1 }

[link]
mode = "Pfc"

[link.pfc]
buffer_capacity = [100000, 0, 0, 0, 0, 0, 0, 0]
xoff = [20000, 0, 0, 0, 0, 0, 0, 0]
xon = [10000, 0, 0, 0, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[2, 0]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

# The P16 workaround: the controller pinned at line rate (a cut floors at min_rate, an increase
# clamps at max_rate) on the no-CC pacing grid.
[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 1.0
max_rate_gbps = 1.0
pacing_interval_ns = 8000

