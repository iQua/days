# An example configuration file that uses custom routing.

seed = 1000
edges = [[0, 1], [1, 2], [0, 2]]
hosts = [0, 1, 2]
log_path = "./custom_routing"
log_interval = 1.0

[switch]
port_rate = 8000
capacity = 100
weights = [1]
discipline = "FIFO"
drop = "RED"

[[flow]]
flow_type = "PacketDistribution"
graph = [[0, 2]]
[flow.traffic]
    initial_delay = 1.0
    duration = 2.0
    arr_dist = {type = "Uniform", low = 1, high = 1}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1500}

[[flow]]
flow_type = "PacketDistribution"
graph = [[0, 2]]
path = [0, 1, 2]
[flow.traffic]
    initial_delay = 4.0
    duration = 2.0
    arr_dist = {type = "Uniform", low = 1, high = 1}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1500}

[[flow]]
flow_type = "PacketDistribution"
graph = [[1, 0]]
path = [1, 0]
[flow.traffic]
    initial_delay = 2.0
    duration = 4.0
    arr_dist = {type = "Uniform", low = 1, high = 1}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1500}

[[collective]]
collective_type = "Broadcast"
flow_type = "PacketDistribution"
flow_count = 2
paths = [[0, 1], [0, 1, 2]]
[collective.traffic]
    initial_delay = 1.0
    duration = 3.0
    arr_dist = {type = "Uniform", low = 1, high = 1}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1500}