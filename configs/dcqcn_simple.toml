# Simple DCQCN example configuration.

seed = 42
edges = [[0, 1]]
hosts = [0, 1]
duration = 0.05
log_path = "logs/dcqcn_simple"

[switch]
port_rate = 10000000000
capacity = 128
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.6

[[flow]]
flow_type = "DCQCN"
graph = [[0, 1]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 10.0
min_rate_gbps = 1.0
max_rate_gbps = 10.0
g = 0.5
ai_rate_gbps = 0.5
hai_rate_gbps = 1.0
mi_factor = 0.5
rtt_ns = 100000
cnp_interval_ns = 10000
pacing_interval_ns = 1000
cnp_priority = 0
