# P11 T20a diagnostic-only frontier fixture. It preserves T13f load-90's topology, 7,373 source
# pairs, 21 ns offered interval, seed, and 18 us stop, but caps each flow at 16 KiB so compile-time
# instrumentation can retain multiple samples within the campaign budget.
seed = 13032
duration = 0.000018
threading = "single"
log_path = "logs/p11/fattree_k32_load90_profile"

[topology]
category = "FatTree"

[topology.fat_tree]
k = 32
hosts_per_edge = 16

[switch]
port_rate = 100_000_000_000
capacity = 1024
weights = [1]
discipline = "FIFO"
drop = "TailDrop"

[link]
propagation_ns = 1000

[[flow_set]]
flow_type = "PacketDistribution"
flow_count = 7373
traffic = { initial_delay = 0.0, size = 16_384, arr_dist = { type = "Uniform", low = 0.000000021, high = 0.000000021 }, pkt_size_dist = { type = "Uniform", low = 256, high = 256 } }
