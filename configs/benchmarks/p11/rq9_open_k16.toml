# P11 T20a RQ9 rung 0: pure forward-only traffic. The 512-byte packet certifies the registered
# 41 ns channel bound at 100 Gbit/s with zero propagation. Twelve long-lived flows are the
# calibrated open-loop width control for the sparse-round TCP fixture.
seed = 2416
duration = 0.01
threading = "single"
log_path = "logs/p11/rq9_open_k16"

[topology]
category = "FatTree"

[topology.fat_tree]
k = 16
hosts_per_edge = 8

[switch]
port_rate = 100_000_000_000
capacity = 64
weights = [1]
discipline = "FIFO"
drop = "TailDrop"

[link]
propagation_ns = 0

[[flow_set]]
flow_type = "PacketDistribution"
flow_count = 1

[flow_set.traffic]
initial_delay = 0.0
size = 50_000_000
arr_dist = { type = "Uniform", low = 0.000000117, high = 0.000000117 }
pkt_size_dist = { type = "Uniform", low = 512, high = 512 }
