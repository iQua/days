# T15e sustained ~90% point: exact 64x flow-byte and stop-time scaling of load_90.
# T15d W4 estimate: 1,416,769,416 ns / 18 rounds * 1,152 rounds ~= 90.7 s.
# Estimated work is ~1.9907B transitions; this intentionally exceeds the spike budget.
# Endpoint seed 13032 preserves the short fixture's 7,373 source/sink pairs.
seed = 13032
duration = 0.001152
threading = "single"
log_path = "logs/width_via_load_full/fattree_k32_load_90_sustained"

[topology]
category = "FatTree"

[topology.fat_tree]
k = 32
hosts_per_edge = 16

[switch]
port_rate = 100_000_000_000
capacity = 1024
weights = [1]
discipline = "FIFO"
drop = "TailDrop"

[link]
propagation_ns = 1000

[[flow_set]]
flow_type = "PacketDistribution"
flow_count = 7373
traffic = { initial_delay = 0.0, size = 16_777_216, arr_dist = { type = "Uniform", low = 0.000000021, high = 0.000000021 }, pkt_size_dist = { type = "Uniform", low = 256, high = 256 } }
