# Micro benchmark for LeanGuard CUBIC/AQM trace checking.

seed = 42
edges = [[0, 1]]
hosts = [0, 1]
duration = 0.5
threading = "single"
log_path = "logs/bench/leanguard_tcp_cubic_micro"
ui_interval = 1e9

[switch]
    port_rate = 1000000000 # 1 Gbps
    capacity = 1024
    weights = [1]
    discipline = "FIFO"
    drop = "TailDrop"

[[flow]]
    flow_type = "TCP"
    graph = [[0, 1]]
    routing = "ECMP"

    [flow.traffic]
        initial_delay = 0.0
        size = 5000000
        arr_dist = { type = "Uniform", low = 0.0001, high = 0.0001 }
        pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

    [flow.traffic.tcp]
        cc_algorithm = "CUBIC"

    [flow.traffic.tcp.cubic]
        beta = 0.7
        c = 0.4
        fast_convergence = true
