# LeanGuard CI fixture: P14's three-source PFC incast (tests/p16_pfc_service_identity.rs) under
# WFQ. Priorities 3 and 1 are lossless and pause; priority 0 is not PFC-controlled, so its packets
# are served past paused heads. tests/leanguard_certificates.rs resumes it from its seventh
# eighth-of-the-run checkpoint, taken while a switch queue is paused, and writes the WFQ and PFC
# certificates of the resumed run.
seed = 14
edges = [[0, 2], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.001

[switch]
port_rate = 1_000_000_000
capacity = 1000
weights = [3, 1, 2]
priorities = [3, 2, 1]
discipline = "WFQ"
drop = "TailDrop"

[link]
mode = "Pfc"

[link.pfc]
xoff = [0, 3000, 0, 3000, 0, 0, 0, 0]
xon = [0, 1500, 0, 1500, 0, 0, 0, 0]
pause_quanta = [1, 1, 1, 1, 1, 1, 1, 1]
buffer_capacity = [0, 8000, 0, 8000, 0, 0, 0, 0]

[[flow]]
flow_type = "PacketDistribution"
priority = 3
graph = [[0, 3]]

[flow.traffic]
initial_delay = 0.0
size = 100000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[[flow]]
flow_type = "PacketDistribution"
priority = 1
graph = [[1, 3]]

[flow.traffic]
initial_delay = 0.000002
size = 100000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[[flow]]
flow_type = "PacketDistribution"
priority = 0
graph = [[0, 3]]

[flow.traffic]
initial_delay = 0.000001
size = 60000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[[flow]]
flow_type = "PacketDistribution"
priority = 3
graph = [[2, 3]]

[flow.traffic]
initial_delay = 0.000003
size = 60000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }
