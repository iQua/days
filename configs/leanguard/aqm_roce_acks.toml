# LeanGuard CI fixture: RoCE ACKs share an ECN-marking queue with data. Hosts 1 and 2 send RoCE
# data to host 0 through switch 3, so switch 3's egress to host 0 crosses its ECN threshold; host
# 0's queue pair to host 2 has its ACKs on that same egress. Days AGO marks only data packets, so
# an ACK admitted at or above the threshold stays unmarked (docs: configuration/switches).
# tests/leanguard_certificates.rs lowers it and writes the Scalar AQM certificate
# lean/fixtures/p10c/aqm_roce_acks_compiled_executor_accept.csv.
seed = 16
edges = [[0, 3], [1, 3], [2, 3]]
hosts = [0, 1, 2]
duration = 0.001

[switch]
port_rate = 1000000000
capacity = 20
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.25

[link]
mode = "Pfc"

[link.pfc]
buffer_capacity = [0, 0, 0, 0, 0, 0, 0, 0]
xoff = [0, 0, 0, 0, 0, 0, 0, 0]
xon = [0, 0, 0, 0, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[1, 0]]

[flow.traffic]
initial_delay = 0.0
size = 20000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 1000000

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[2, 0]]

[flow.traffic]
initial_delay = 0.0
size = 20000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 1000000

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[0, 2]]

[flow.traffic]
initial_delay = 0.0
size = 20000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
