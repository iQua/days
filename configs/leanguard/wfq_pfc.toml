# LeanGuard CI fixture: WFQ under switch-link PFC. As pfc_switch.toml, with WFQ weights [1, 3] and
# host 1's flow on priority 0, which PFC does not pause: while switch 5 pauses priority 3 at
# switch 4, switch 4's WFQ egress serves host 1's packets past waiting priority-3 packets with
# smaller finish tags.
# tests/leanguard_certificates.rs lowers it and writes the Scalar certificate.
seed = 16
edges = [[0, 4], [1, 4], [4, 5], [3, 5], [2, 5]]
hosts = [0, 1, 2, 3]
duration = 0.0001

[switch]
port_rate = 8000000000
capacity = 100
weights = [1, 3]
discipline = "WFQ"
drop = "TailDrop"

[link]
mode = "Pfc"

[link.pfc]
xoff = [0, 0, 0, 3000, 0, 0, 0, 0]
xon = [0, 0, 0, 1000, 0, 0, 0, 0]
pause_quanta = [0, 0, 0, 1, 0, 0, 0, 0]
buffer_capacity = [0, 0, 0, 100000, 0, 0, 0, 0]

[[flow]]
flow_type = "PacketDistribution"
priority = 3
graph = [[0, 2]]

[flow.traffic]
initial_delay = 0.0
size = 6000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "Uniform", low = 1000, high = 1000 }

[[flow]]
flow_type = "PacketDistribution"
priority = 0
graph = [[1, 2]]

[flow.traffic]
initial_delay = 0.0
size = 16000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "Uniform", low = 1000, high = 1000 }

[[flow]]
flow_type = "PacketDistribution"
priority = 3
graph = [[3, 2]]

[flow.traffic]
initial_delay = 0.0
size = 6000
arr_dist = { type = "Uniform", low = 0.000001, high = 0.000001 }
pkt_size_dist = { type = "Uniform", low = 1000, high = 1000 }
