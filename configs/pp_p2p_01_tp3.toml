seed = 1

# Topology: 3 pipeline stages (0,1,2) connected via one switch (3)
edges = [[0, 3], [1, 3], [2, 3]]
hosts = [0, 1, 2]

duration = 30.0
log_path = "logs/pp_p2p_01_tp3"

[app_source]
req_channel_capacity = 256
chunk_size = 512
initial_delay = 1
run_interval = 50

[switch]
port_rate = 1e11
capacity = 0
discipline = "FIFO"
drop = "TailDrop"

[[collective]]
# Model a single P2P activation as a 1-flow Broadcast.
collective_type = "Broadcast"
flow_type = "PacketDistribution"
flow_count = 1
sources = [0]
sinks = [1]

[collective.traffic]
initial_delay = 0.0
size = 8388608
arr_dist = { type = "Uniform", low = 1e-9, high = 1e-9 }
pkt_size_dist = { type = "DiscreteUniform", low = 512, high = 512 }

