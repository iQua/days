# Minimal deterministic DCQCN + AQM trace used by the LeanGuard CI workflow.

seed = 42
edges = [[0, 1]]
hosts = [0, 1]
duration = 0.2
threading = "single"
log_path = "logs/ci/leanguard_dcqcn"

[switch]
port_rate = 1000000000
capacity = 512
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.2

[link]
mode = "Pfc"

[link.pfc]
# 0 disables drops at the PFC ingress buffer (lossless L2).
buffer_capacity = [0, 0, 0, 0, 0, 0, 0, 0]

[[flow]]
flow_type = "DCQCN"
graph = [[0, 1]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1.0, high = 1.0 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 10.0
min_rate_gbps = 1.0
max_rate_gbps = 10.0
g = 0.5
ai_rate_gbps = 0.5
hai_rate_gbps = 1.0
mi_factor = 0.5
rtt_ns = 100000
cnp_interval_ns = 10000
pacing_interval_ns = 1000
cnp_priority = 0
