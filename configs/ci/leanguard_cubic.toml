# Minimal deterministic TCP CUBIC trace used by the LeanGuard CI workflow.

seed = 1000
edges = [[0, 1]]
hosts = [0, 1]
duration = 0.2
threading = "single"
log_path = "logs/ci/leanguard_cubic"

[switch]
port_rate = 100000000
capacity = 100
weights = [1]
discipline = "FIFO"
drop = "TailDrop"

[[flow]]
flow_type = "TCP"
graph = [[0, 1]]
routing = "ECMP"

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1.0, high = 1.0 }
pkt_size_dist = { type = "DiscreteUniform", low = 1024, high = 1024 }

[flow.traffic.tcp]
cc_algorithm = "CUBIC"

[flow.traffic.tcp.cubic]
beta = 0.7
c = 0.4
fast_convergence = true
