# P16 D1 condition 1 (plans/briefs/p16/dcqcn-go.md): the lazy controller against the eager oracle
# on an image whose controller grids collide. Derived from configs/p15/roce_cnp_under_pfc.toml with
# alpha_resume_interval_ns = 1000, rate_decrease_interval_ns = 999 and rp_timer_ns = 1998: the first
# decrease check (t0 + 1000) meets the first alpha tick, every rate-increase fire meets a decrease
# check (RP = 2D), and feedback, which arrives on the 1 us pacing lattice, meets alpha ticks.
# incast's PFC pauses. Contract: CNPs and pause frames occur; every QP completes.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.02

[switch]
port_rate = 1000000000
capacity = 1000
discipline = "FIFO"
drop = "TailDrop"
ecn_capacity_bytes = 1_000_000
ecn = { kmin_bytes = 50_000, kmax_bytes = 50_000, pmax = 1 }

[link]
mode = "Pfc"

[link.pfc]
buffer_capacity = [100000, 0, 0, 0, 0, 0, 0, 0]
xoff = [20000, 0, 0, 0, 0, 0, 0, 0]
xon = [10000, 0, 0, 0, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[2, 0]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
alpha_resume_interval_ns = 1000
rate_decrease_interval_ns = 999
rp_timer_ns = 1998
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 1000000

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[3, 0]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

