# P16 D1 fix round 1 (review F1): same-instant coverage of the decrease grid and the rate-increase
# timer, for queue pairs. configs/p16/dcqcn_mlx_coincident_qp.toml with rate_decrease_interval_ns = 3
# and rp_timer_ns = 5: the decrease grid and the RP timer fire every few nanoseconds, so echoing
# ACKs land exactly on idle decrease-grid instants (the grid fires with no decrease pending; the
# feedback, a phase-0 arrival, precedes it, so the cut is at the feedback's own instant, ruling D3)
# and on RP fires. Coverage (tests/p16_dcqcn_oracle_fixtures.rs): 218 feedbacks on an idle grid
# instant, 178 on an RP fire. The dense timers make each transition apply many RP fires (about
# 1.3 million in the run).
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.02

[switch]
port_rate = 1000000000
capacity = 1000
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.05

[link]
mode = "Pfc"

[link.pfc]
buffer_capacity = [100000, 0, 0, 0, 0, 0, 0, 0]
xoff = [20000, 0, 0, 0, 0, 0, 0, 0]
xon = [10000, 0, 0, 0, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[2, 0]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
alpha_resume_interval_ns = 1000
rate_decrease_interval_ns = 3
rp_timer_ns = 5
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 1000000

[[flow]]
flow_type = "RoCE"
priority = 0
graph = [[3, 0]]

[flow.traffic]
initial_delay = 0.0
size = 200000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

