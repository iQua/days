# P16 D1 ruling D7: the queue-pair window (SimAI `HAS_WIN` and `VAR_WIN`; design note
# days-gpu evidence/P16/dcqcn-design.md section 4). The 3->1 incast of
# configs/p15/hostpfc_incast_lossless.toml (host-link PFC on class 3, feedback on class 0) with ECN
# marking at 5% of a 300-packet queue, so echoes cut the pairs' rates and a variable window
# shrinks with them, a second queue pair on host 1, and XON at 18,000 B (P15: 10,000 B), so a
# host pause is short enough to begin and end inside a window park. Windows: host 1 a fixed 200,000 B (it
# drives host 1's pauses) and a fixed 4,000 B paced every 8 us, one packet of credit per tick,
# so its status is Blocked by the window alone (window-parked while host 1 is paused); host 2 a
# variable 20,000 B; host 3 a variable 8,000 B. Contract (tests/p16_roce_window.rs):
# window-blocked ticks park without credit until feedback; a window-parked pair sits in a class
# paused at its host and is not restarted by the RESUME; every queue pair completes.
seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.05

[switch]
port_rate = 1000000000
capacity = 300
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.05

[link]
mode = "Pfc"

[link.pfc]
host_links = true
buffer_capacity = [0, 0, 0, 100000, 0, 0, 0, 0]
xoff = [0, 0, 0, 20000, 0, 0, 0, 0]
xon = [0, 0, 0, 18000, 0, 0, 0, 0]

[[flow]]
flow_type = "RoCE"
priority = 3
graph = [[1, 0]]

[flow.traffic]
initial_delay = 0.0
size = 1000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 0
feedback_priority = 0
window_bytes = 200000

[[flow]]
flow_type = "RoCE"
priority = 3
graph = [[2, 0]]

[flow.traffic]
initial_delay = 0.0
size = 1000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 1.0
min_rate_gbps = 0.01
max_rate_gbps = 1.0
g = 0.00390625
ai_rate_gbps = 0.005
hai_rate_gbps = 0.05
rp_timer_ns = 50000
pacing_interval_ns = 1000

[flow.traffic.roce]
retransmit_timeout_ns = 0
feedback_priority = 0
