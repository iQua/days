# P16 D1: a Blocked unreliable DCQCN source with an armed Mellanox-form controller, for the device
# checkpoint and planner tests (tests/p14_device_dcqcn.rs). Derived from
# configs/p14/dcqcn_multi_zero_xoff.toml with 2 MB flows (10x), a 10 ms stop and a 5 Gb/s initial
# rate: below one 1,000 B packet per 1 us tick, so the credit pacer banks nothing and blocks on
# alternate ticks, and each flow is still sending when its first cuts land.
# P14 Lane B executable fixture (2026-09-27 orchestrator ruling).
# Derived from configs/dcqcn_multi.toml, which is a legacy-simulator input that the current compiler does not lower.
# Derivation: add all-zero link.pfc.xoff and link.pfc.xon arrays after buffer_capacity (PFC lowered but inert), as tests/planner_bit_equal.rs does.
# The legacy source stays untouched; this file exists for executor byte-identity gates.

# DCQCN multi-flow example for trace-checker experiments.

seed = 42
edges = [[0, 1], [1, 2], [2, 3]]
hosts = [0, 1, 2, 3]
duration = 0.01
log_path = "logs/dcqcn_multi"

[switch]
port_rate = 1000000000
capacity = 512
discipline = "FIFO"
drop = "ECN_THRESHOLD"
ecn_threshold = 0.2

[link]
mode = "Pfc"

[link.pfc]
# 0 disables drops at the PFC ingress buffer (lossless L2).
buffer_capacity = [0, 0, 0, 0, 0, 0, 0, 0]
xoff = [0, 0, 0, 0, 0, 0, 0, 0]
xon = [0, 0, 0, 0, 0, 0, 0, 0]

[[flow]]
flow_type = "DCQCN"
graph = [[0, 3]]

[flow.traffic]
initial_delay = 0.0
size = 2000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 5.0
min_rate_gbps = 1.0
max_rate_gbps = 10.0
g = 0.5
ai_rate_gbps = 0.5
hai_rate_gbps = 1.0
rp_timer_ns = 100000
cnp_interval_ns = 10000
pacing_interval_ns = 1000
cnp_priority = 0

[[flow]]
flow_type = "DCQCN"
graph = [[1, 2]]

[flow.traffic]
initial_delay = 0.0
size = 2000000
arr_dist = { type = "Uniform", low = 1, high = 1 }
pkt_size_dist = { type = "DiscreteUniform", low = 1000, high = 1000 }

[flow.traffic.dcqcn]
rate_gbps = 5.0
min_rate_gbps = 1.0
max_rate_gbps = 10.0
g = 0.5
ai_rate_gbps = 0.5
hai_rate_gbps = 1.0
rp_timer_ns = 100000
cnp_interval_ns = 10000
pacing_interval_ns = 1000
cnp_priority = 0
