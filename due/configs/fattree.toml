# An example configuration file for the FatTree topology.

seed = 1000

[topology]
category = "FatTree"

[topology.fat_tree]
    k = 4

[switch]
port_rate = 320000 # process 40 packets (1000 bytes) per second
capacity = 100
weights = [1]
discipline = "FIFO"
drop = "RED"

[[flow_set]]
flow_type = "PacketDistribution"
flow_count = 63
[flow_set.traffic]
    initial_delay = 1.0
    duration = 1500.0
    arr_dist = {type = "Uniform", low = 1, high = 1}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1000}

[[flow]]
flow_type = "PacketDistribution"
graph = [[0, 1]]
[flow.traffic]
    initial_delay = 1.0
    duration = 1500.0
    arr_dist = {type = "Uniform", low = 1, high = 1}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1000}