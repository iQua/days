# An example configuration file for collective communication.

seed = 1000
edges = [[0, 2], [0, 3], [1, 2], [1, 3], [0, 4], [3, 4]]
hosts = [0, 1, 2, 3, 4, 5]

[switch]
port_rate = 8000
capacity = 100
weights = [1]
discipline = "FIFO"
drop = "RED"

[[collective]]
collective_type = "AllReduce"
flow_type = "PacketDistribution"
graph = [[0, 2], [0, 3], [1, 2], [1, 3]]
sources = [0, 1]
sinks = [2, 3]
[collective.traffic]
    initial_delay = 1.0
    duration = 10.0
    arr_dist = {type = "Uniform", low = 1, high = 2}
    pkt_size_dist = {type = "Uniform", low = 1000, high = 1500}

[[collective]]
collective_type = "AllReduce"
flow_type = "PacketDistribution"
graph = [[0, 4], [3, 4]]
sources = [0, 3]
sinks = [4]
[collective.traffic]
    initial_delay = 1.0
    duration = 10.0
    arr_dist = {type = "Uniform", low = 3, high = 4}
    pkt_size_dist = {type = "Uniform", low = 2000, high = 2500}
