[package]
name = "days-legacy"
version = "0.4.3"
description = "Nexosim-based legacy engine for Days"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
repository = "https://github.com/iqua/days"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[lib]
name = "days_legacy"

[[bin]]
name = "days"
path = "src/main.rs"

[features]
test = ["days/test"]
l2 = []
l2_pfc = ["l2", "days/l2_pfc"]
dcqcn = ["days/dcqcn"]
lean = ["days/lean"]
perf_stats = ["nexosim/perf_stats"]

# FROZEN CRATE -- every version below is an EXACT pin (`=x.y.z`), not a range.
# See legacy/README.md ("Dependency pinning"). Changing any pin requires a
# changelog entry in that README. `nexosim` resolves through the workspace's
# `[patch.crates-io]` to the vendored `crates/nexosim` tree, so it is frozen by
# source as well as by version.
[dependencies]
csv = "=1.4.0"
days = { path = ".." }
env_logger = "=0.11.11"
indicatif = "=0.18.6"
indicatif-log-bridge = "=0.2.3"
log = "=0.4.33"
nexosim = { version = "=1.0.0", features = ["tracing"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter", "registry"] }
parking_lot = "=0.12.5"
petgraph = "=0.8.3"
rand_distr = "=0.6.0"
rand = "=0.10.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
toml = "=1.1.2"
tempfile = "=3.27.0"
tachyonix = "=0.3.1"
futures = "=0.3.32"
futures-executor = { version = "=0.3.32", default-features = false, features = ["thread-pool"] }
once_cell = "=1.21.4"
num_cpus = "=1.17.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
csv = "=1.4.0"
days-executor = { path = "../executor" }
predicates = "=3.1.4"

[[example]]
name = "basic"

[[example]]
name = "ecn"

[[example]]
name = "switch"

[[example]]
name = "tcp"

[[example]]
name = "tcp_test"

[[example]]
name = "wire"
