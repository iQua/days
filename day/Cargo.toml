[package]
name = "day"
version = "0.1.0"
description = "A Performant Discrete-Event Simulator for Network Simulations"
authors = ["Baochun Li <bli@ece.toronto.edu>"]
repository = "https://github.com/iqua/day.rs"
readme = "README.md"
keywords =  ["network", "simulation", "framework", "time", "discrete", "events"]
categories = ["simulation", "science"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
asynchronix = "0.2"
csv = "1.3"
env_logger = "0.10"
indicatif = "0.17"
indicatif-log-bridge = "0.2"
lazy_static = "1.4"
log = "0.4"
petgraph = "0.6"
rand = {version = "0.8", features = ["small_rng"]}
serde = { version = "1.0", features = ["derive"] }
statrs = "0.16"
toml = "0.8"
