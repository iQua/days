schema_version = 1
policy = "legacy-f64-absolute-deadline"

# This is the finite exact-ledger domain exercised by the P01 migration corpus.
# The test checks every integer-nanosecond base in the inclusive interval.
[aligned_exact_domain]
comparison_boundary = "exact-ledger"
quantum_ns = 1
packet_size_bytes = 1000
rate_bits_per_second = 1_000_000_000
raw_delta_ns = 8000
min_base_ns = 0
max_base_ns_inclusive = 2_000_000

